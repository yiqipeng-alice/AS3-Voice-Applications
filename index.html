<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Communication Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #e8e5ff 0, transparent 32%),
                radial-gradient(circle at bottom right, #dff4f2 0, transparent 30%),
                #f7f7fb;
            color: #202333;
        }

        main {
            max-width: 820px;
            margin: 55px auto;
            padding: 0 22px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 36px;
            letter-spacing: -0.5px;
            color: #25214a;
        }

        .subtitle {
            text-align: center;
            color: #65657a;
            font-size: 17px;
            margin: 12px 0 35px;
        }

        .assistant-box {
            background-color: rgba(255, 255, 255, 0.94);
            border: 1px solid #e4e2ef;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 18px 50px rgba(45, 40, 90, 0.10);
        }

        .question-area {
            display: flex;
            gap: 12px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eceaf3;
        }

        input {
            flex: 1;
            padding: 15px 17px;
            font-size: 16px;
            color: #202333;
            background-color: #fafafe;
            border: 2px solid #d8d5e7;
            border-radius: 12px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #635bba;
            box-shadow: 0 0 0 4px rgba(99, 91, 186, 0.12);
        }

        button {
            padding: 13px 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background-color 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:focus-visible {
            outline: 3px solid #202333;
            outline-offset: 3px;
        }

        .send-button {
            min-width: 90px;
            background-color: #5149a8;
            color: white;
            box-shadow: 0 5px 14px rgba(81, 73, 168, 0.22);
        }

        .send-button:hover {
            background-color: #453e98;
        }

        .message {
            margin-top: 22px;
            padding: 20px;
            border-radius: 16px;
            line-height: 1.6;
        }

        .user-message {
            margin-left: 55px;
            background-color: #eeecff;
            border: 1px solid #dedaff;
        }

        .assistant-message {
            margin-right: 55px;
            background-color: #eef8f6;
            border: 1px solid #d7eeea;
        }

        .label {
            margin-bottom: 7px;
            color: #403b73;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speaker {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            background-color: white;
            border-radius: 50%;
            font-size: 21px;
        }

        .another-button {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            background-color: #25214a;
            color: white;
        }

        .another-button:hover {
            background-color: #393363;
        }

        .options {
            margin-top: 30px;
        }

        .options h2 {
            margin-bottom: 18px;
            font-size: 23px;
            color: #25214a;
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .option-button {
            min-height: 105px;
            padding: 20px;
            background-color: #ffffff;
            border: 2px solid #ddd9ee;
            color: #29264a;
            text-align: left;
            line-height: 1.5;
            box-shadow: 0 4px 12px rgba(45, 40, 90, 0.05);
        }

        .option-button strong {
            display: block;
            margin-bottom: 3px;
            color: #5149a8;
            font-size: 17px;
        }

        .option-button:hover {
            background-color: #f5f3ff;
            border-color: #7168c4;
            box-shadow: 0 8px 20px rgba(45, 40, 90, 0.10);
        }

        .result {
            margin-top: 28px;
            padding: 26px;
            background-color: #faf9fe;
            border: 1px solid #e5e2f0;
            border-radius: 18px;
        }

        .result h2 {
            margin-top: 0;
            color: #25214a;
        }

        .timeline {
            position: relative;
            margin-top: 24px;
        }

        .timeline-item {
            position: relative;
            margin-left: 12px;
            padding: 2px 0 30px 30px;
            border-left: 3px solid #7067bd;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            width: 13px;
            height: 13px;
            left: -8px;
            top: 5px;
            background-color: #5149a8;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 2px #5149a8;
        }

        .timeline-item:last-child {
            padding-bottom: 5px;
        }

        .time {
            margin-bottom: 5px;
            color: #5149a8;
            font-size: 19px;
            font-weight: 700;
        }

        .change-button {
            margin-top: 24px;
            background-color: #e9e7f3;
            color: #353153;
        }

        .change-button:hover {
            background-color: #dcd9eb;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            main {
                margin: 30px auto;
                padding: 0 15px;
            }

            h1 {
                font-size: 29px;
            }

            .assistant-box {
                padding: 20px;
                border-radius: 18px;
            }

            .question-area {
                flex-direction: column;
            }

            .option-grid {
                grid-template-columns: 1fr;
            }

            .user-message,
            .assistant-message {
                margin-left: 0;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

<main>
    <h1>Adaptive Communication Assistant</h1>
    <p class="subtitle">Choose how information works best for you.</p>

    <div class="assistant-box">

        <div class="question-area">
            <input
                id="question"
                type="text"
                value="What are my plans for tomorrow?"
                aria-label="Ask the assistant a question"
            >
            <button class="send-button" onclick="askAssistant()">Send</button>
        </div>

        <div id="conversation" class="hidden">

            <div class="message user-message">
                <div class="label">You</div>
                <div id="userQuestion"></div>
            </div>

            <div class="message assistant-message">
                <div class="label">Assistant</div>

                <div class="status">
                    <span class="speaker">🔊</span>
                    <span>Voice response is playing...</span>
                </div>
            </div>

            <button class="another-button" onclick="showOptions()">
                I need another way
            </button>

        </div>

        <div id="options" class="options hidden">

            <h2>How do you want me to present this information?</h2>

            <div class="option-grid">

                <button class="option-button" onclick="showText()">
                    <strong>Display as Text</strong>
                    Show the complete information on screen
                </button>

                <button class="option-button" onclick="simplify()">
                    <strong>Simplify Information</strong>
                    Show only the essential information
                </button>

                <button class="option-button" onclick="slowSpeech()">
                    <strong>Slow Down Speech</strong>
                    Replay the information more slowly
                </button>

                <button class="option-button" onclick="showTimeline()">
                    <strong>Visual Presentation</strong>
                    Organize the information visually
                </button>

            </div>

        </div>

        <div id="result" class="result hidden"></div>

    </div>
</main>

<script>
    const fullResponse =
        "You have a doctor's appointment at 10:30 AM, a project meeting at 1:00 PM, and dinner with a friend at 6:30 PM.";

    function askAssistant() {
        const question = document.getElementById("question").value;

        document.getElementById("userQuestion").textContent = question;
        document.getElementById("conversation").classList.remove("hidden");
        document.getElementById("options").classList.add("hidden");
        document.getElementById("result").classList.add("hidden");

        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(fullResponse);
        speech.rate = 1;

        window.speechSynthesis.speak(speech);
    }

    function showOptions() {
        window.speechSynthesis.cancel();

        document.getElementById("options").classList.remove("hidden");
        document.getElementById("result").classList.add("hidden");
    }

    function showText() {
        showResult(`
            <h2>Text Version</h2>

            <p>
                You have a doctor's appointment at 10:30 AM,
                a project meeting at 1:00 PM,
                and dinner with a friend at 6:30 PM.
            </p>
        `);
    }

    function simplify() {
        showResult(`
            <h2>Simplified Information</h2>

            <p><strong>10:30 AM</strong> — Doctor</p>
            <p><strong>1:00 PM</strong> — Meeting</p>
            <p><strong>6:30 PM</strong> — Dinner</p>
        `);
    }

    function slowSpeech() {
        window.speechSynthesis.cancel();

        const speech = new SpeechSynthesisUtterance(fullResponse);
        speech.rate = 0.6;

        window.speechSynthesis.speak(speech);

        showResult(`
            <h2>Slower Speech</h2>

            <div class="status">
                <span class="speaker">🔊</span>
                <span>The information is being replayed at a slower speed.</span>
            </div>
        `, false);
    }

    function showTimeline() {
        showResult(`
            <h2>Tomorrow</h2>

            <div class="timeline">

                <div class="timeline-item">
                    <div class="time">10:30 AM</div>
                    <div>Doctor's Appointment</div>
                </div>

                <div class="timeline-item">
                    <div class="time">1:00 PM</div>
                    <div>Project Meeting</div>
                </div>

                <div class="timeline-item">
                    <div class="time">6:30 PM</div>
                    <div>Dinner with a Friend</div>
                </div>

            </div>
        `);
    }

    function showResult(content, stopSpeech = true) {
        if (stopSpeech) {
            window.speechSynthesis.cancel();
        }

        const result = document.getElementById("result");

        result.innerHTML = content + `
            <button class="change-button" onclick="showOptions()">
                Change presentation
            </button>
        `;

        result.classList.remove("hidden");
        document.getElementById("options").classList.add("hidden");
    }
</script>

</body>
</html>
